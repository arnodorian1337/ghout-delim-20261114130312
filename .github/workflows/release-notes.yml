name: 'Generate Release Notes (delimiter test)'
on:
  release:
    types: ['published']
jobs:
  generate-release-notes:
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
    steps:
      - name: 'Get release information'
        id: 'release_info'
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          TIME="${{ github.event.release.created_at }}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "TIME=${TIME}" >> "$GITHUB_OUTPUT"
          echo 'RAW_CHANGELOG<<EOF' >> "$GITHUB_OUTPUT"
          printf "%s\n" "$BODY" >> "$GITHUB_OUTPUT"
          echo 'EOF' >> "$GITHUB_OUTPUT"
        env:
          BODY: '${{ github.event.release.body }}'
      - name: 'Validate version'
        id: 'validate_version'
        run: |
          if echo "${{ steps.release_info.outputs.VERSION }}" | grep -q "nightly"; then
            echo "CONTINUE=false" >> "$GITHUB_OUTPUT"
          else
            echo "CONTINUE=true" >> "$GITHUB_OUTPUT"
          fi